services:
  web:
    ports: !override
      - "127.0.0.1:8000:8000"
  jibri:
    cap_add:
      - SYS_ADMIN
      - NET_BIND_SERVICE
    devices:
      - /dev/snd:/dev/snd
    mem_limit: 2500m
    cpus: 2
  jibri1:
    extends:
      file: jibri.yml
      service: jibri
    container_name: jitsi-jibri1
    cap_add:
      - SYS_ADMIN
      - NET_BIND_SERVICE
    devices:
      - /dev/snd:/dev/snd
    mem_limit: 2500m
    cpus: 2
    environment:
      - JIBRI_INSTANCE_ID=tfs-jibri-1
    volumes:
      - /opt/jitsi-cfg/jibri1:/config:Z
      - /opt/jitsi-cfg/storage/jibri1:/storage:Z
      - /opt/jitsi-cfg/jibri1/asoundrc:/home/s6/.asoundrc:ro
  jibri2:
